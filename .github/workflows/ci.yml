#
# Every push and pull request: format and lint the port, build it, run the
# corpus against the Python reference and against the binary, apply every
# case for real in both link modes and require the next dry run to find
# nothing to do, and diff what the two implementations leave behind.
# Windows runs the binary only: the reference never ships there.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QBRANCH_BIN: ${{ startsWith(matrix.os, 'windows') && 'target/release/qbranch.exe' || 'target/release/qbranch' }}
    steps:
      - name: Let git create real symlinks (the corpus fixtures hold some)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - name: Corpus, Python reference
        if: runner.os != 'Windows'
        run: python tests/run_corpus.py
        env:
          QBRANCH_BIN: ""
      - name: Corpus, Python reference, applied
        if: runner.os != 'Windows'
        run: python tests/run_corpus.py --apply
        env:
          QBRANCH_BIN: ""
      - name: Corpus, binary
        run: python tests/run_corpus.py
      - name: Corpus, binary, applied
        run: python tests/run_corpus.py --apply
      - name: Corpus, binary, applied in copy mode
        run: python tests/run_corpus.py --apply
        env:
          QBRANCH_LINK_MODE: copy
      - name: Apply parity, reference versus binary
        if: runner.os != 'Windows'
        run: python tests/run_parity.py
