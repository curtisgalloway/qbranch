# SPDX-FileCopyrightText: 2026 Curtis Galloway
# SPDX-License-Identifier: Apache-2.0
#
# On a version tag: build one binary per platform and run the corpus against
# each where a native runner exists, package them (a tarball everywhere, a
# .deb for Linux, a signed per-user MSI and a zip for Windows), install and
# exercise every package in the job that built it, attach everything to a
# GitHub release with a checksums file, then fan out: re-pin the Homebrew
# tap's formula and publish the crate.
#
# workflow_dispatch builds and smoke-tests the packages as workflow artifacts
# only, with no release and no fan-out, for testing the pipeline.
#
# The Linux binaries are built for musl, so they are fully static and run on
# any distribution regardless of its glibc; the .deb depends on nothing.
#
# What arms the optional parts (each skips, with a warning, until it is set):
#   - Windows signing: a `release` environment with a reviewer rule, the
#     secrets AZURE_CLIENT_ID and AZURE_TENANT_ID, and the variables
#     AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and AZURE_SIGNING_PROFILE.
#     Until AZURE_SIGNING_ACCOUNT is set the MSI ships unsigned, and the
#     verify step is what keeps "unset" from looking like "working".
#   - The tap bump: HOMEBREW_TAP_DISPATCH_TOKEN, a fine-grained PAT with
#     Contents:write on curtisgalloway/homebrew-tap.
#   - crates.io: the variable CRATES_PUBLISH=true, once the crate exists and
#     declares this workflow as a trusted publisher.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: 2.46.3

jobs:
  # One place decides what version is being built, so no two jobs can
  # disagree about it, and the tag check runs once rather than per platform.
  version:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0~dev.$(printf '%.7s' "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          fi

      # A tag that disagrees with the crate or the reference script would ship
      # a package whose --version lies about what it is. Refuse before
      # building anything.
      - name: Check the tag matches Cargo.toml and the reference script
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=$(sed -n -E 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)
          script=$(python3 bin/qbranch --version | cut -d' ' -f2)
          if [ "$crate" != "$VERSION" ] || [ "$script" != "$VERSION" ]; then
            echo "::error::tag says ${VERSION}, Cargo.toml says ${crate}, bin/qbranch says ${script}"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          # Cross-built on the Apple Silicon runner; the corpus needs a native host.
          - { os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, test: true, deb: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, test: true, deb: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      BIN: target/${{ matrix.target }}/release/qbranch
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target "$TARGET"

      - name: Corpus against this binary
        if: matrix.test
        run: python tests/run_corpus.py
        env:
          QBRANCH_BIN: ${{ env.BIN }}

      # One directory at the top, holding the binary, the docs and the tool's
      # own skills, so unpacking it somewhere leaves one thing to move.
      - name: Package the tarball
        run: |
          name="qbranch-v${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "$BIN" LICENSE README.md "dist/$name/"
          cp -R skills "dist/$name/skills"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"

      - name: Install nfpm
        if: matrix.deb
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo apt-get install -y /tmp/nfpm.deb

      - name: Build the .deb
        if: matrix.deb
        env:
          ARCH: ${{ matrix.deb }}
        run: |
          mkdir -p packaging/stage
          install -m 0755 "$BIN" packaging/stage/qbranch
          nfpm package -f packaging/nfpm.yaml -p deb -t "dist/qbranch_${VERSION}_${ARCH}.deb"

      # Installed for real, from the same file that will be uploaded, and run
      # against a manifest from a scratch directory, so the package is proven
      # to put a working qbranch on PATH and not just to unpack.
      - name: Install the .deb and exercise it from a scratch directory
        if: matrix.deb
        run: |
          sudo apt-get install -y ./dist/qbranch_*.deb
          test -x /usr/bin/qbranch
          test -f /usr/share/qbranch/skills/review-plugins/SKILL.md
          test -f /usr/share/qbranch/skills/agent-audit/SKILL.md
          test -f /usr/share/doc/qbranch/LICENSE
          crate=$(sed -n -E 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)
          reported=$(/usr/bin/qbranch --version)
          if [ "$(echo "$reported" | cut -d' ' -f2)" != "$crate" ]; then
            echo "::error::installed qbranch reports '${reported}', Cargo.toml says ${crate}"
            exit 1
          fi
          scratch=$(mktemp -d)
          mkdir -p "$scratch/root/manifests"
          echo '{"schema": 2, "name": "smoke"}' > "$scratch/root/manifests/smoke.json"
          ( cd "$scratch" && /usr/bin/qbranch --root "$scratch/root" --manifest smoke --dry-run )
          sudo apt-get remove -y qbranch
          test ! -e /usr/bin/qbranch

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qbranch-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: build (x86_64-pc-windows-msvc)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    # The signing identity is a federated credential whose subject names this
    # environment: Entra federated credentials take no wildcards, so a
    # refs/tags/* subject is impossible and the tag-triggered job has to
    # authenticate through an environment with a fixed name. The
    # environment's reviewer rule is what makes a release wait for one
    # approval.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
      EXE: target\x86_64-pc-windows-msvc\release\qbranch.exe
    steps:
      - name: Let git create real symlinks (the corpus fixtures hold some)
        run: git config --global core.symlinks true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Corpus against this binary
        run: python tests/run_corpus.py
        env:
          QBRANCH_BIN: target/x86_64-pc-windows-msvc/release/qbranch.exe

      # ---- Signing. Every step skips while AZURE_SIGNING_ACCOUNT is unset,
      # so an un-onboarded repo (or a fork) ships unsigned instead of failing.
      #
      # allow-no-subscriptions, and no subscription-id, on purpose: the
      # signing identity holds only Artifact Signing Certificate Profile
      # Signer, scoped to the profile, so an ordinary login enumerates zero
      # subscriptions and dies with "No subscriptions found" after the OIDC
      # exchange succeeded, which reads like an auth failure and is not one.
      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The exe is signed before it goes into the MSI and the zip, because
      # the exe is what runs. timestamp-rfc3161 is set explicitly: these
      # certificates live 72 hours, so an untimestamped signature verifies on
      # release day and is invalid three days later on every copy already
      # downloaded. That must not rest on a third-party default staying put.
      - name: Sign the executable
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\${{ env.EXE }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install the WiX v7 CLI
        run: dotnet tool install --global wix

      # WiX v7 refuses to build anything until its Open Source Maintenance
      # Fee EULA is accepted (error WIX7015). The fee applies to consumers
      # generating revenue; this one does not.
      - name: Accept the WiX OSMF EULA
        run: wix eula accept wix7

      - name: Build the MSI
        shell: pwsh
        run: packaging\windows\build.ps1 -Version $env:VERSION -Exe $env:EXE -OutDir dist

      # The signing action wants an absolute path and the MSI name carries the
      # version, so resolve it once here rather than re-globbing per step.
      - name: Locate the MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign the MSI
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.msi.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the executable and the MSI are signed and timestamped
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.msi.outputs.path }}
        run: |
          foreach ($file in @((Join-Path $env:GITHUB_WORKSPACE $env:EXE), $env:MSI_PATH)) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file`: $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::$file is not validly signed (status: $($sig.Status))"
              exit 1
            }
            if (-not $sig.TimeStamperCertificate) {
              Write-Host "::error::$file has no RFC 3161 timestamp; its signature dies with the 72-hour certificate"
              exit 1
            }
            Write-Host "timestamped by: $($sig.TimeStamperCertificate.Subject)"
          }

      # Installed for real, from the same file that will be uploaded, and
      # exercised from a scratch directory: the files are where the layout
      # says, bin\ landed on the user PATH, the binary is this build, a dry
      # run against a manifest works, and the uninstall takes it all back.
      - name: Install the MSI and exercise it from a scratch directory
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.msi.outputs.path }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList `
            '/i', "`"$env:MSI_PATH`"", '/qn', '/l*v', "`"$log`""
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "msiexec install failed: $($p.ExitCode)"
          }
          $prefix = Join-Path $env:LOCALAPPDATA "Programs\qbranch"
          foreach ($file in 'bin\qbranch.exe', 'share\qbranch\skills\review-plugins\SKILL.md',
                            'share\qbranch\skills\agent-audit\SKILL.md', 'doc\LICENSE', 'doc\README.md') {
            if (-not (Test-Path "$prefix\$file")) { throw "the package shipped no $file" }
          }

          # The PATH entry lands in HKCU\Environment for shells started from
          # now on; this process does not see it, so read it back from there.
          # msiexec writes the directory with a trailing backslash (seen on
          # brik, 2026-09-02), hence the TrimEnd.
          $userPath = (Get-ItemProperty HKCU:\Environment -Name Path).Path
          if (-not ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -eq "$prefix\bin" })) {
            throw "the install did not put $prefix\bin on the user PATH (got: $userPath)"
          }

          $crate = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $reported = & "$prefix\bin\qbranch.exe" --version
          if (($reported -split ' ')[1] -ne $crate) {
            throw "installed qbranch reports '$reported', Cargo.toml says $crate"
          }

          $scratch = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force "$scratch\root\manifests" | Out-Null
          Set-Content "$scratch\root\manifests\smoke.json" '{"schema": 2, "name": "smoke"}'
          Set-Location $scratch
          & "$prefix\bin\qbranch.exe" --root "$scratch\root" --manifest smoke --dry-run
          if ($LASTEXITCODE -ne 0) { throw "qbranch dry run failed: $LASTEXITCODE" }

          Write-Host "== uninstalling"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', "`"$env:MSI_PATH`"", '/qn'
          if ($p.ExitCode -ne 0) { throw "msiexec uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$prefix\bin\qbranch.exe") { throw "uninstall left qbranch.exe behind" }
          $userPath = (Get-ItemProperty HKCU:\Environment -Name Path -ErrorAction SilentlyContinue).Path
          if ($userPath -and ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -eq "$prefix\bin" })) {
            throw "uninstall left $prefix\bin on the user PATH"
          }

      # The zip carries the signed exe for people who would rather not run an
      # installer, and for cargo binstall; same top directory as the tarballs.
      - name: Package the zip
        shell: pwsh
        run: |
          $name = "qbranch-v$env:VERSION-x86_64-pc-windows-msvc"
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $env:EXE, LICENSE, README.md $stage
          Copy-Item -Recurse skills "$stage\skills"
          Compress-Archive -Path $stage -DestinationPath "dist\$name.zip"
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qbranch-x86_64-pc-windows-msvc
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  publish:
    name: publish the GitHub release
    if: github.ref_type == 'tag'
    needs: [version, build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Every package into one directory, so the release step takes the whole
      # thing and no platform can be quietly left off the page.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # What the Homebrew formula, cargo binstall and a careful human verify
      # against.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # generate_release_notes appends the changelog after this body. The
      # install section is written by hand because the generated notes only
      # list commits, and someone arriving at the release page needs to be
      # told that Homebrew and the .deb exist.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS**: Homebrew, the channel that keeps itself current. The tap
            is re-pinned by this release.

            ```
            brew install curtisgalloway/tap/qbranch
            ```

            **Debian, Ubuntu, Raspberry Pi OS**: the `.deb` below is fully
            static and depends on nothing.

            ```
            sudo apt install ./qbranch_${{ needs.version.outputs.version }}_amd64.deb   # or _arm64
            ```

            **Windows**: the signed per-user MSI below installs under
            `%LOCALAPPDATA%\Programs\qbranch`, puts it on your PATH and needs
            no elevation. Symbolic links need Developer Mode; without it
            qbranch copies instead and says so.

            ```
            msiexec /i qbranch-v${{ needs.version.outputs.version }}-x86_64-pc-windows-msvc.msi /qn
            ```

            **With a Rust toolchain**: `cargo install qbranch`, or
            `cargo binstall qbranch` for the prebuilt binary.

            **Anything else**: a tarball or zip per platform below, listed in
            `SHA256SUMS`. Unpack it and put `qbranch` on your PATH.

            Every package was installed and exercised by the job that built
            it, after the corpus passed against that binary.

  tap:
    name: bump the Homebrew tap
    # A prerelease tag is not something to move every brew user onto.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Tell the tap to re-pin its formula to this release's tarballs. The
      # tap's workflow does the edit with its own token; this only needs
      # permission to fire the dispatch, which the default token cannot do
      # across repositories. Absent, skip rather than fail: the tap's
      # workflow_dispatch covers the manual path.
      - name: Dispatch the formula bump to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_DISPATCH_TOKEN not set; skipping the tap bump." \
                 "Run the tap's 'Bump qbranch formula' workflow by hand instead."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/curtisgalloway/homebrew-tap/dispatches \
            -d "{\"event_type\":\"qbranch-release\",\"client_payload\":{\"tag\":\"${TAG}\"}}"
          echo "Dispatched qbranch-release (${TAG}) to homebrew-tap."

  crates:
    name: publish to crates.io
    # Gated on a repository variable, so the job does not exist until the
    # crate has a trusted publisher: crates.io lets only an existing crate
    # declare one, so the first publish comes from a maintainer's machine
    # with a token, and this job takes over from the second release on.
    # Prereleases stay off crates.io.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && vars.CRATES_PUBLISH == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
