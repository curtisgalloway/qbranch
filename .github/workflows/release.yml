#
# On a version tag: build one binary per platform, run the corpus against
# each where a runner exists for it, and attach them to a GitHub release.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, exe: qbranch, test: true }
          # Cross-built on the Apple Silicon runner; the corpus needs a native host.
          - { os: macos-latest, target: x86_64-apple-darwin, exe: qbranch, test: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: qbranch, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: qbranch, test: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: qbranch.exe, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Corpus against this binary
        if: matrix.test
        run: python tests/run_corpus.py
        env:
          QBRANCH_BIN: target/${{ matrix.target }}/release/${{ matrix.exe }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          cp LICENSE README.md dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../qbranch-${{ github.ref_name }}-${{ matrix.target }}.zip" .
          else
            tar czf "../qbranch-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qbranch-${{ matrix.target }}
          path: qbranch-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
