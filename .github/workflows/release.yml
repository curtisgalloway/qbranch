#
# On a version tag: build one binary per platform, run the corpus against
# each where a runner exists for it, and attach them to a GitHub release.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, exe: qbranch }
          - { os: macos-13, target: x86_64-apple-darwin, exe: qbranch }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: qbranch }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: qbranch }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: qbranch.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Corpus against this binary
        run: python tests/run_corpus.py
        env:
          QBRANCH_BIN: target/${{ matrix.target }}/release/${{ matrix.exe }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          cp LICENSE README.md dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../qbranch-${{ github.ref_name }}-${{ matrix.target }}.zip" .
          else
            tar czf "../qbranch-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: qbranch-${{ matrix.target }}
          path: qbranch-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
