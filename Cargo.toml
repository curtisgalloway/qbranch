[package]
name = "qbranch"
version = "0.2.0"
edition = "2021"
description = "Outfits a machine's coding agents from a per-machine manifest"
license = "Apache-2.0"
repository = "https://github.com/curtisgalloway/qbranch"
readme = "README.md"
keywords = ["claude-code", "agents", "skills", "dotfiles"]
categories = ["command-line-utilities"]

[[bin]]
name = "qbranch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
